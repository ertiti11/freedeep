name: Feature request
description: Suggest a focused improvement to freedeep
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the use case rather than only the proposed implementation. Do not include account credentials or private session data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
